<article class="theorem theorem-like"><h2 class="heading">
<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">1.4.22</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">The Mean Value Theorem of Integration.</span>
</h2>
<div class="para logical">
<div class="para">Let <span class="process-math">\(f\)</span> be continuous on <span class="process-math">\([a,b]\text{.}\)</span>  There exists a value <span class="process-math">\(c\)</span> in <span class="process-math">\([a,b]\)</span> such that</div>
<div class="displaymath process-math">
\begin{equation*}
\int_a^bf(x)\, dx = f(c)(b-a)\text{.}
\end{equation*}
</div>
