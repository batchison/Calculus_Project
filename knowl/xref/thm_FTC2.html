<article class="theorem theorem-like"><h2 class="heading">
<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">1.4.8</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Fundamental Theorem of Calculus, Part 2.</span>
</h2>
<div class="para logical">
<div class="para">Let <span class="process-math">\(f\)</span> be continuous on <span class="process-math">\([a,b]\)</span> and let <span class="process-math">\(F\)</span> be <em class="emphasis">any</em> antiderivative of <span class="process-math">\(f\text{.}\)</span> Then </div>
<div class="displaymath process-math">
\begin{equation*}
\int_a^b f(x)\, dx = F(b) - F(a)\text{.}
\end{equation*}
</div>
