<div class="para" id="fig_rie1b-2-2-1">The parabola shown in <a href="sec_riemann.html#fig_rie1a" class="xref" data-knowl="./knowl/xref/fig_rie1a.html" data-reveal-label="Reveal" data-close-label="Close" title="Figure 1.3.1">Figure 1.3.1</a>. The shaded are is being approximated by 4 rectangles of width 1. The left most rectangle has a height of 3 and is labeled "RHR," for "Right Hand Rule." The height of the rectangle is equal to the height of the parabola om the rightmost side, where <span class="process-math">\(x = 1\text{.}\)</span> The second rectangle has a height of 3.75, and is labeled "MPR," for "Midpoint Rule." The height of the rectangle is equal to the height of the parabola at the center of the rectangle, where <span class="process-math">\(x=1.5\text{.}\)</span> The third rectangle had a height of 4, and is labeled "LHR," for "Left Hand Rule." The height of the rectangle is given by the height of the parabola on the leftmost side, where <span class="process-math">\(x = 2\text{.}\)</span> The rightmost rectangle has a height of 2.6, and is labeled "other". The height is given by the height of the parabola at a point slightly to the right of the center of the rectangle.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#fig_rie1b-2-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
