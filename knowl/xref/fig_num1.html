<div class="para" id="fig_num1b-2-2-1">The graph of <span class="process-math">\(e^{-x^2}\)</span> starts at <span class="process-math">\((0, 1)\)</span> and slowly slopes downwards to the right as it slowly gets closer to the positive <span class="process-math">\(x\)</span> axis. To use the left hand rule we divide the area between <span class="process-math">\([0, 1]\)</span> five rectangles of equal widhth and decreasing height. As the curve moves closer to the <span class="process-math">\(x\)</span> axis, the heights of the rectangles gets shorter even thought the widths stay the same. Because the curve is downwards sloping to the right, the top right corners of the rectangles contain a little region which is above the curve. As the curve moves downwards and the height of the rectangles become shorter, the area that is contained by the top right corners of the rectangles and the top of the curve gets larger. We calculate the sum of the areas of these rectangles.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#fig_num1b-2-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>

<div class="para" id="fig_num1a-2-2-1">For this image we consider the same downwards sloping curve of <span class="process-math">\(e^{-x^2}\text{.}\)</span> We divide the area between <span class="process-math">\([0,1]\)</span> into five rectangles of equal width and decreasing height. For the right hand rule the rectangles are drawn in such a way that the top right corners of the rectangles touch the bottom of the curve. There is a small area between the top left of the triangles and the bottom of the curve. This area gets larger as the curve moves downwards and the lengths of the rectangles decrease. For the left hand rule we add up the areas of these rectangles.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#fig_num1a-2-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
