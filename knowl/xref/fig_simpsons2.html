<div class="para" id="fig_simpsons2-2-2-1">The graph of <span class="process-math">\(f(x)=\sin(\pi x)+2\)</span> is shaped like wave that oscillates between <span class="process-math">\(y=3\)</span> and <span class="process-math">\(y=1\)</span> as it moves in the positive x direction. We consider the area under the curve from <span class="process-math">\(x=0\)</span> to <span class="process-math">\(x=5\text{.}\)</span> THe area is subdivided into eight intervals and each interval is approximated by quadratic curves. The first quadratic curve is a downward parabola with its vertex at <span class="process-math">\((3,0.5)\)</span> which approximates the first two subintervals. The second quadratic curve is also a parabola whose vertex is located at <span class="process-math">\((1.5,1)\text{.}\)</span> This parabola approximates the second two subintervals between <span class="process-math">\(x=1.25\)</span> and <span class="process-math">\(x=2.5\text{.}\)</span> The next two subintervals are are approximated by the left half of a parabola whose vertex is at <span class="process-math">\((3.75,1.25)\text{.}\)</span> The area under the last two subintervals are approximated by a downwards parabola whose vertex is at <span class="process-math">\((3,4.5)\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#fig_simpsons2-2-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
