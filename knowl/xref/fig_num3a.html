<div class="para" id="fig_num3a-2-2-1">The graph of <span class="process-math">\(e^{-x^2}\)</span> starts from <span class="process-math">\((0,1)\)</span> and slopes downwards to the right in the positive x direction. We consider the are under the curve from <span class="process-math">\((0,1)\)</span> to <span class="process-math">\((1, 0.25)\)</span> in the first quadrant. The area is approximated with five adjacent trapezoids of equal width but decreasing heights. The upper arms of the trapezoids are downwar sloping and they follow the graph of <span class="process-math">\(e^{-x^2}\)</span> very closely which allows for more precise approximation. Both of the upper corners of the trapezoids lie on the curve. The first trapezoid is the tallest one and the fifth one is the shortest.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#fig_num3a-2-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
