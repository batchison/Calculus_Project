<div class="para" id="fig_num2b-2-2-1">We calculate <span class="process-math">\(\int_{-\frac{\pi}4}^{\frac{\pi}/2}\sin(x^3)\, dx\)</span> using the left hand rule. The graph of <span class="process-math">\(\sin(x^3)\)</span> starts at <span class="process-math">\((-0.75, -0.5)\)</span> in the fourth quadrant and curves upwards to the right. It merges with the negative <span class="process-math">\(x\)</span> axis close to <span class="process-math">\((-0.25, 0)\)</span> and continues along the <span class="process-math">\(x\)</span> axis until <span class="process-math">\((0.25, 0)\)</span> and then slopes upwards to the right. The graph continues upwards until <span class="process-math">\((1.25, 1)\)</span> in the first quadrant and then descends sharply. It crosses the positive <span class="process-math">\(x\)</span> axis close to <span class="process-math">\((1.5, 0)\)</span> and continues downwards. We divide the areas under the curve into boxes of equal width but varying height. The far left side of the graph is divided into three boxes of decreasing length that are below the negative <span class="process-math">\(x\)</span> axis. THe rectangle farthest to the left is the tallest and the other two get get shorter as the graph moves upwards towards the negative <span class="process-math">\(x\)</span> axis. The region roughly from <span class="process-math">\((-0.25, 0)\)</span> to <span class="process-math">\((0.25, 0)\)</span> where the curve moves along the <span class="process-math">\(x\)</span> axis there are no boxes since the are of that part is zero. Then the part of the graph in the first quadrant is divided into five rectangles. As the graph rises up, the heights of the rectangles increase. The first one being the shortest and the fourth one being the tallest. The fifth rectangle is shorter than the fourth one but taller than the first three. We add up the areas of the rectangles to approximate the integral.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#fig_num2b-2-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
